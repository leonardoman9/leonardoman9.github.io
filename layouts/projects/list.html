{{ define "main" }}
  <main class="container">
    <h1>{{ .Title }}</h1>
    {{ with site.Data.resume.projects }}
      <div class="project-card-grid">
        {{ range . }}
          {{ $slug := .slug | default (urlize .name) }}
          <article class="project-card">
            {{ with .image }}
              <a href="{{ printf "/projects/%s/" $slug | relURL }}">
                <img src="{{ . | relURL }}" alt="" loading="lazy" />
              </a>
            {{ end }}
            <div>
              <h2><a href="{{ printf "/projects/%s/" $slug | relURL }}">{{ .name }}</a></h2>
              {{ with .summary }}<p>{{ . }}</p>{{ end }}
            </div>
          </article>
        {{ end }}
      </div>
    {{ end }}
  </main>
{{ end }}
