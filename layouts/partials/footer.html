<footer class="container">
  {{ with .Site.Params.social }}
    <div class="footer-social">
      {{ range . }}
        <a class="social-link" href="{{ .url }}" rel="me" title="{{ .name }}">
          {{ partial "feather.html" .icon }}
          <span class="sr-only">{{ .name }}</span>
        </a>
      {{ end }}
    </div>
  {{ end }}
  <p>
    <small>
      © {{ now.Format "2006" }} {{ site.Copyright }}
      {{ with site.Params.footer.text }}· {{ . }}{{ end }}
    </small>
  </p>
</footer>
